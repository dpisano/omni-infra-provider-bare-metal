# THIS FILE IS HAND WRITTEN, unlike the other workflows here, which kres generates.
#
# The kres-generated CI, which this fork has deleted, built and pushed this image, but only inside
# the Sidero Labs infrastructure: it asked for a self-hosted runner group, a buildkit endpoint on
# their internal network, and a sops key to decrypt an encrypted secrets file. A fork has none of
# those, so that job never produced an image here.
#
# This workflow builds the very same image, through the very same make target, on a stock GitHub
# runner, and pushes it to this repository owner's namespace on GHCR.
#
# kres leaves files it does not generate alone, so `make rekres` does not touch this one. Do not
# add it to .kres.yaml, or the two would fight over the same job.

name: docker-image

concurrency:
  # Keyed on the ref being built, not the triggering ref, so a release build of a tag does not
  # share a group with main and cancel it, or get cancelled by it.
  group: docker-image-${{ inputs.ref || github.ref }}
  # a push that supersedes an in-flight build makes that build's image obsolete before it exists
  cancel-in-progress: true

# The image tag is never set here. It comes from `make image-provider`, which derives IMAGE_TAG
# from `git describe --tag --always --match v[0-9]*`, the same derivation upstream's own (deleted)
# CI workflow used. So pushing a version tag produces an image tagged with exactly that version,
# and a commit to main produces the :v0.12.0-7-g63cc659-style describe output.
#
# That only holds while the repository carries tags. A fork starts with none, and `git describe`
# then falls back to --always and yields a bare commit SHA, so upstream-release.yaml is what puts
# a version tag on this fork in the first place.
#
# A pull request does not build, so the first proof that a change still builds comes after it
# merges; run `make image-provider` locally to check before then.
'on':
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
  # upstream-release.yaml calls this after it tags a release, because a tag pushed with
  # GITHUB_TOKEN deliberately does not trigger the push above.
  workflow_call:
    inputs:
      ref:
        description: the git ref to build, defaulting to the one the workflow was triggered on
        type: string
        required: false
        default: ''

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # version: v7.0.0
        with:
          # the image tag comes from `git describe`, so the full history and the tags are needed
          fetch-depth: 0
          # empty for every trigger but workflow_call, where checkout treats it as "the default"
          ref: ${{ inputs.ref }}

      - name: set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # version: v4.2.0

      - name: derive the image namespace
        # GHCR rejects an upper case namespace, and the owner login is otherwise used verbatim
        run: echo "IMAGE_USERNAME=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # version: v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles: its build stages run on the build platform and only the
      # resulting binaries are copied into the per-architecture images, so QEMU is not needed to
      # produce the arm64 image on an amd64 runner.
      - name: build and push the provider image
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ env.IMAGE_USERNAME }}
          PLATFORM: linux/amd64,linux/arm64
          PUSH: "true"
        run: |
          make image-provider
